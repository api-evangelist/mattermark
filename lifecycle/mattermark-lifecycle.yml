summary: >-
  Mattermark publishes no versioning policy, no deprecation policy, no SLA and
  no status page. It maintains two parallel, mutually inconsistent developer
  documentation sites, and at probe time neither API host completes a TLS
  handshake — the documented surfaces are not callable.
