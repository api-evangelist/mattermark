documentation_divergence:
  finding: >-
    The two documentation sites disagree about the API. The older MkDocs site
    and the Swagger definition agree on GET /companies/{id}/people and
    GET /fundings; documentation prose elsewhere in the network had recorded
    /companies/{id}/personnel and /funding-events. The specification in the
    company's own GitHub org is treated as authoritative here.
  risk: >-
    A consumer landing on developer.mattermark.com never learns that a
    machine-readable contract exists; it is published only on GitHub and on the
    older docs host.
availability:
  checked: '2026-08-14'
  api_hosts_reachable: false
  evidence:
  - {host: 'api.mattermark.com', dns: '154.3.62.35 (the marketing site IP)', http: '301 to https', https: 'TLS alert 112 unrecognized_name — no certificate served for this SNI'}
  - {host: 'eapi.mattermark.com', dns: '154.3.62.35 (the marketing site IP)', http: '301 to https', https: 'TLS alert 112 unrecognized_name — no certificate served for this SNI'}
  - {host: 'eapi-sandbox.mattermark.com', dns: 'dangling CNAME to prod-eapi-sandbox.us-east-1.elasticbeanstalk.com (no A record)', https: unreachable}
  - {host: 'api-sandbox.mattermark.com', dns: 'dangling CNAME to prod-dwapi-sandbox.us-east-1.elasticbeanstalk.com (no A record)', https: unreachable}
  finding: >-
    Both production API hostnames now point at the WordPress marketing site's IP
    address, which serves no certificate matching those names, so every HTTPS
    request fails at the handshake. Both sandbox hostnames are dangling CNAMEs
    to deleted AWS Elastic Beanstalk environments. The documentation, the
    pricing page, the specification and the developer hub all remain published
    and unchanged, so the API reads as live to a human but is not callable by
    any client.
  operational_risk: >-
    The two dangling Elastic Beanstalk CNAMEs are a standing subdomain-takeover
    exposure: anyone who can create an environment with those names in
    us-east-1 would serve content from a mattermark.com subdomain that the
    provider's own documentation instructs developers to send API keys to.
  classification: documented-but-not-callable
deprecated_operations: []
