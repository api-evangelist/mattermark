summary: >-
  Mattermark publishes NO first-party client SDK in any package registry. Its
  entire GitHub organisation contains a single public repository, and that
  repository holds the OpenAPI/Swagger definition rather than a client library.
  The three packages below are community wrappers by third parties; all are
  official: false. Every one of them was last published between 2014 and 2017 —
  before the 2019 relaunch — so no maintained client library exists for this API
  in any language.
