name: Mattermark
description: >-
  Mattermark is a business-intelligence platform for data-driven deal making,
  providing profiles on roughly four million companies and twenty million key
  contacts along with their investors, funding events, and news. Relaunched as
  an independent company, Mattermark exposes its dataset through a REST API
  (api.mattermark.com) and a GraphQL API (eapi.mattermark.com), both
  authenticated with a Bearer API key and queryable with the Mattermark Search
  Filter Language (MSFL). Originally an a16z / Slow Ventures / Version One
  Ventures-backed startup, it is tracked in the API Evangelist network as a
  company profile.
