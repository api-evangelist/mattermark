apis:
- name: Mattermark GraphQL API
  description: >-
    GraphQL access to the Mattermark dataset using the Mattermark Search Filter Language (MSFL) for complex
    company and investor queries. Read-only: the published schema declares 57 types under a single RootQuery
    and no mutation type. Organizations model both companies and investors, discriminated by companyPersona
    / investorPersona.
