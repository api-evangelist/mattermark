standards:
- id: openapi
  conforms: partial
  version: 'Swagger 2.0'
  evidence: >-
    github.com/Mattermark/mattermark-openapi publishes a valid Swagger 2.0
    document with 11 operations, 40 definitions, unique operationIds, summaries,
    descriptions, tags and inline response examples. It predates OpenAPI 3.x and
    has not been migrated (last pushed 2018-05-24).
  gaps:
  - Swagger 2.0 rather than OpenAPI 3.x
  - 8 of 11 operations declare only a 200 response, no 4xx/5xx
  - The documented `key` query-parameter auth is not declared as a security definition
- id: graphql
  conforms: true
  evidence: >-
    A GraphQL API is published at https://eapi.mattermark.com/ and the provider
    publishes its own introspection result at
    docs.mattermark.com/graphql_api/schema.json (57 types, RootQuery, no
    mutations), plus the introspection query itself at
    graphql_api/introspection.gql.
- id: graphql-relay-connections
  conforms: true
  evidence: >-
    The schema implements the Relay conventions — a Node interface with a
    node(id:) root field, and Connection/Edge/PageInfo types for organization
    summaries and funding-round summaries.
- id: rest
  conforms: true
  evidence: Resource-oriented HTTP endpoints under https://api.mattermark.com/ returning application/json.
