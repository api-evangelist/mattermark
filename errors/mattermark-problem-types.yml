envelope_note: >-
  Mattermark signals outcomes with HTTP status codes only. Neither the
  documentation nor the first-party Swagger definition publishes an RFC 9457
  application/problem+json body, an error code registry, or any error body
  schema — the spec's 400 responses carry a description string and no schema.
  An agent therefore cannot distinguish failure causes programmatically beyond
  the status code.
